# nginx for ChronoCut: static files only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The PDF engine is a ~10 MB WebAssembly file, ~5 MB compressed. nginx's
    # default mime.types already maps .wasm to application/wasm (needed for
    # fast compilation in the browser). Do NOT add a types {} block here: it
    # would replace the whole MIME table.
    gzip on;
    gzip_types application/wasm application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Nothing is uploaded: refuse anything but reading.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Note: an add_header inside a location drops all server-level ones, so
    # the security headers are repeated in each location.

    # Files in assets/ carry a content hash in their name: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # index.html is never cached, so an update shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }
}
